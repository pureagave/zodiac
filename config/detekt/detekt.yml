style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    # Input-validation / hardware-setup code reads cleanest as a short
    # sequence of early-return guards (NMEA + coordinate parsing, USB/GPS
    # source bring-up). Default 2 is tight for that style; 3 caps it
    # without forcing arrow-nesting.
    max: 3

complexity:
  LongMethod:
    active: false
  LongParameterList:
    # Manual DI (no Hilt): CockpitViewModel + its factory take one collaborator
    # per dependency, so the constructor grows by one each time the cockpit gains
    # a real data source (visionFeedFlow, the tri-state DRIVER HUD feed-health
    # signal, was the latest; before it, poisFlow for playa-discovery contacts).
    # Bumped from the default 7 to keep just above the current count (10 params).
    # NOTE: the VM is a god-object due for a split (drive-to / map-camera / sensor
    # delegates) before it grows further.
    constructorThreshold: 11
    # Compose components idiomatically take theme + a few data/callbacks + a
    # trailing Modifier; e.g. driveToBar (theme, active, bathActive, onSelect,
    # onSelectBath, modifier). Bumped from the default 6 to 7 for that shape.
    functionThreshold: 7
    # Optional params with defaults don't create the call-site burden this rule
    # exists to catch — callers that don't need them never name them, and in
    # Compose that trailing-optional shape is the standard way to keep a
    # component flexible (opsReadout's `aim`/`beacon`/`modifier` are all
    # omitted by callers that have nothing to pass). Count the required
    # arguments, which is what actually makes a call site unreadable.
    ignoreDefaultParameters: true
  TooManyFunctions:
    # Default 11 was tight for CockpitViewModel which exposes one method per
    # discrete cockpit operation. Bumped each time a discrete cockpit action
    # is added (concept cycling; the private sendCommand dispatch helper;
    # setNavTarget; driveToNearestToilet; recomputeRoute; setAddressEntryOpen +
    # driveToAddress for the address keypad were the latest); kept just above the
    # actual count. NOTE: the VM is becoming a god-object — due for a split
    # (drive-to / map-camera / GPS delegates) before it grows much further.
    thresholdInClasses: 24
    # CRTVectorScreen.kt is the canonical screen — header / left / right
    # rail / center viewport / chips all live as private composables in
    # one file. DriverNightScreen.kt then pushed higher: it's a hand-drawn
    # vector HUD, so it carries a stack of small private Canvas/DrawScope
    # helpers (grid, arch, figure, bracket, reticle, text). 18 fits that.
    thresholdInFiles: 18
    # NmeaParser is the fleet's one central sentence reader; it grows a parser per
    # proprietary sentence (ZTLM/ZAUD/ZENV/ZSHK/ZBCN/ZODO) alongside standard
    # GGA/RMC/heading. If it keeps growing, split the proprietary Z-sentences into
    # their own object. SurroundRing (Phase 1.5: bands, clustering, hysteresis,
    # coverage arcs, speed-gated braking, all pure + tested) pushed higher still —
    # bumped from 18 to 20 to fit both.
    thresholdInObjects: 20

naming:
  FunctionNaming:
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
