name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Uses the project's Gradle wrapper (8.10.2) as the single source of
      # truth for the Gradle version; the action provides dependency caching.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Deliberately UNSCOPED (not :app:). :beacon had no CI of any kind until
      # 2026-08-10 -- its 77 unit tests, ktlint, detekt, lint and assemble had
      # never run on a push, on the one module that must survive a reboot and run
      # unattended for a week. Unscoping also means a fourth module is covered the
      # day it is added, rather than the day someone remembers to add a step.
      - name: Ktlint
        run: ./gradlew ktlintCheck --stacktrace

      - name: Detekt
        run: ./gradlew detekt --stacktrace

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace
